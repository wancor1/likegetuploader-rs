[package]
name = "likeget-uploader"
version = "1.3.0"
edition = "2021"
description = "uploader.jp のようなリスト式アップローダー（Rust 版）"
license = "MIT"

[dependencies]
actix-web = "4"
actix-multipart = "0.6"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bcrypt = "0.15"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
base64 = "0.22"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
opt-level = "z"
lto = true
